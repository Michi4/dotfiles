# ~/.config/foot/foot.ini

# Terminal type (for SSH compatibility)
term=xterm-256color

# Font
font=monospace:size=12

[colors-dark]
alpha=0.69
foreground=d8e1dc
background=111518

# Cursor (foreground + background for cursor)
cursor=111518 6feee6

# ANSI / basic colors
regular0=1c1f23
regular1=cc6a6a
regular2=7acb8f
regular3=c6c56e
regular4=6caad6
regular5=aa88cc
regular6=6fc7b6
regular7=d0d4d3

bright0=3a4045
bright1=ff7a7a
bright2=98e0a6
bright3=eee88a
bright4=88c8f2
bright5=c8a4e6
bright6=6feee6
bright7=f4f7f6

# Selection colors
selection-foreground=111518
selection-background=6feee6

# Scrollback indicator & URL underline
scrollback-indicator=d8e1dc 6fc7b6
urls=6feee6

[scrollback]
lines=100000
multiplier=3.0
indicator-position=relative

[cursor]
style=beam
blink=true
beam-thickness=1.5

