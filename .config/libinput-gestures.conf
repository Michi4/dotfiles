# 3-finger horizontal: switch workspaces
gesture swipe left  3 playerctl next
gesture swipe right 3 playerctl previous
#gesture hold 4 playerctl play-pause

# 3-finger vertical: volume control
gesture swipe up    3 pactl set-sink-volume @DEFAULT_SINK@ +5%
gesture swipe down  3 pactl set-sink-volume @DEFAULT_SINK@ -5%

# 4-finger swipe up/down: show or close wofi
#gesture swipe up    4 wofi --show drun
#gesture swipe down  4 swaymsg kill

# 4-finger horizontal: switch workspaces
gesture swipe right  4 swaymsg workspace next
gesture swipe left 4 swaymsg workspace prev

