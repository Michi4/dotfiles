# 3-finger vertical: volume control smooth 5% via 1% x5 delayed 100ms
gesture swipe up    3 /home/michi/.config/libinput-gestures/volume-up.sh
gesture swipe down  3 /home/michi/.config/libinput-gestures/volume-down.sh
# 3-finger horizontal: media next/previous (left = next, right = previous)
gesture swipe left  3 bash -c 'sleep 0.1; playerctl next'
gesture swipe right 3 bash -c 'sleep 0.1; playerctl previous'
# 4-finger horizontal: workspace next/previous (left = next, right = previous)
gesture swipe left  4 swaymsg workspace next
gesture swipe right 4 swaymsg workspace prev
