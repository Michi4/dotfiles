<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Reject woff2-font-awesome web icon fonts from the system fallback: they
       outranked Noto Color Emoji for emoji codepoints (e.g. U+1F600 rendered
       as an icon glyph / tofu). Web pages load these .woff2 files directly
       through CSS, so this breaks nothing. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/WOFF2/*</glob>
    </rejectfont>
  </selectfont>

  <!-- Keep the original terminal / generic-monospace font (FreeMono).
       Installing noto-fonts added "Noto Sans Mono", which fontconfig then
       started to prefer for the generic "monospace" family - changing the
       terminal font. This pins the previous default back. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FreeMono</family>
    </prefer>
  </alias>
</fontconfig>
