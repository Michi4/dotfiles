<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- woff2-font-awesome ships web icon fonts into /usr/share/fonts/WOFF2.
       fontconfig scanned them and they outranked Noto Color Emoji for emoji
       codepoints (e.g. U+1F600 rendered as an icon glyph / tofu).
       Web pages load these .woff2 files directly through CSS, so excluding
       them from system font fallback breaks nothing. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/WOFF2/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
